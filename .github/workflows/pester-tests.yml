name: PowerShell Pester Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester-tests:
    name: Run Pester 5 tests
    runs-on: windows-latest

    steps:
      # Check out the repository so the test file and scripts are available.
      - name: Check out repository
        uses: actions/checkout@v7

      # Use the Windows PowerShell 5.1 executable provided by the runner.
      - name: Verify Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)."
          }
          Write-Host "Using Windows PowerShell $($PSVersionTable.PSVersion)."

      # Install and import the exact Pester version used by this workflow.
      - name: Install and import Pester 5.9.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck -Confirm:$false
          Import-Module -Name Pester -RequiredVersion 5.9.1 -Force
          $pesterVersion = (Get-Module -Name Pester).Version
          if ($pesterVersion -ne [version]'5.9.1') {
            throw "Expected Pester 5.9.1, got $pesterVersion."
          }
          Write-Host "Using Pester $pesterVersion."

      # Run only the requested tests, print detailed test output, and return a
      # failing process exit code whenever Pester reports failed tests.
      - name: Run Get-LocalAdministrators tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Invoke-Pester -Path 'tests/Get-LocalAdministrators.Tests.ps1' -Output Detailed -PassThru
          Write-Host "TotalCount: $($result.TotalCount)"
          Write-Host "PassedCount: $($result.PassedCount)"
          Write-Host "FailedCount: $($result.FailedCount)"
          if ($result.TotalCount -eq 0 -or ($result.PassedCount + $result.FailedCount) -eq 0) {
            throw 'Pester did not discover or execute any tests.'
          }
          if ($result.Result -ne 'Passed') {
            throw "Pester result was '$($result.Result)' instead of 'Passed'."
          }
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failed test(s)."
          }
